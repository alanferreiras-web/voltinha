<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef">
  <title>Voltinha do Trendices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #181715;
      --muted: #716d67;
      --line: rgba(24, 23, 21, .14);
      --paper: rgba(255, 255, 255, .62);
      --paper-strong: rgba(255, 255, 255, .82);
      --pink: #f5c6cf;
      --lilac: #d9cdf6;
      --yellow: #f4dc67;
      --green: #d2e8ad;
      --blue: #c6ddf5;
      --orange: #f2c5a8;
      --radius: 30px;
      --shadow: 0 18px 55px rgba(64, 54, 43, .08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 3%, rgba(245, 198, 207, .42), transparent 28rem),
        radial-gradient(circle at 88% 7%, rgba(198, 221, 245, .42), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .55; }

    .shell { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }
    .site-header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-size: 24px;
      line-height: 1;
      font-weight: 600;
      text-decoration: none;
    }
    .quiet-button {
      border: 0;
      border-bottom: 1px solid currentColor;
      background: transparent;
      padding: 5px 0;
      cursor: pointer;
    }

    .loading-screen, .error-screen {
      min-height: calc(100svh - 76px);
      display: grid;
      place-items: center;
      text-align: center;
    }
    .loading-mark {
      width: 34px;
      height: 34px;
      border: 2px solid var(--line);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .edition-view[hidden], .loading-screen[hidden], .error-screen[hidden] { display: none; }
    .hero { padding: clamp(58px, 9vh, 106px) 0 clamp(76px, 12vh, 138px); }
    .edition-date { color: var(--muted); font-size: clamp(15px, 1.8vw, 21px); }
    .edition-title {
      margin: 8px 0 0;
      font-size: clamp(58px, 9vw, 122px);
      line-height: .9;
      letter-spacing: -.055em;
      font-weight: 600;
    }
    .curation-copy {
      max-width: 760px;
      margin-top: clamp(34px, 5vw, 62px);
      font-size: clamp(18px, 2vw, 25px);
      line-height: 1.34;
      letter-spacing: -.025em;
    }
    .curation-line { display: block; }
    .curation-line strong { display: inline-block; min-width: 2.2ch; font-weight: 600; }
    .curation-link { margin-left: 8px; font-size: .64em; white-space: nowrap; }

    .chapter { padding: clamp(86px, 13vw, 170px) 0; }
    .hero + .chapter { padding-top: clamp(48px, 7vw, 90px); }
    .chapter-marker {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .chapter-title {
      margin: 0 0 clamp(28px, 4vw, 50px);
      max-width: 760px;
      font-size: clamp(34px, 5vw, 66px);
      line-height: 1;
      letter-spacing: -.045em;
      font-weight: 600;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 2.4vw, 32px);
      align-items: start;
    }
    .signal-card {
      --card-tint: var(--blue);
      display: flex;
      flex-direction: column;
      padding: clamp(22px, 2.5vw, 34px);
      border: 1px solid rgba(24, 23, 21, .08);
      border-radius: 24px;
      background: color-mix(in srgb, var(--card-tint) 52%, var(--paper-strong));
      box-shadow: var(--shadow);
    }
    .signal-card.tone-1 { --card-tint: var(--pink); }
    .signal-card.tone-2 { --card-tint: var(--lilac); }
    .signal-card.tone-3 { --card-tint: var(--yellow); }
    .signal-card.tone-4 { --card-tint: var(--green); }
    .signal-card.tone-5 { --card-tint: var(--blue); }
    .signal-card.tone-6 { --card-tint: var(--orange); }
    .signal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .signal-number {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .58);
      font-size: 14px;
      font-weight: 600;
    }
    .theme-list { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .theme-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid rgba(24, 23, 21, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .34);
      font-size: 11px;
    }
    .signal-support {
      margin: clamp(24px, 3vw, 36px) 0 10px;
      color: rgba(24, 23, 21, .68);
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: .07em;
      font-weight: 600;
      text-transform: uppercase;
    }
    .signal-title {
      margin: 0;
      max-width: 19ch;
      font-size: clamp(30px, 3.7vw, 48px);
      line-height: 1.02;
      letter-spacing: -.04em;
      font-weight: 600;
    }
    .signal-synthesis { margin: 14px 0 0; max-width: 62ch; color: rgba(24, 23, 21, .72); font-size: 13px; line-height: 1.5; }
    .signal-evidence { margin-top: 26px; padding-top: 22px; border-top: 1px solid rgba(24, 23, 21, .13); }
    .signal-evidence-label { margin-bottom: 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .signal-evidence-copy { margin: 0; color: rgba(24, 23, 21, .72); font-size: 13px; line-height: 1.5; }
    .signal-source-link, .signal-source-text { display: inline-block; margin-top: 10px; color: rgba(24, 23, 21, .68); font-size: 12px; }

    .terms-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, .7fr);
      gap: clamp(28px, 5vw, 76px);
      align-items: start;
    }
    .term-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
    .term-button {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      width: 100%;
      padding: 16px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: opacity .2s ease, padding .2s ease;
    }
    .term-button:hover { padding-left: 8px; }
    .term-button[aria-pressed="true"] { font-weight: 600; }
    .term-button[aria-pressed="false"] { color: var(--muted); }
    .term-count { font-size: 11px; }
    .term-panel {
      position: sticky;
      top: 26px;
      min-height: 300px;
      padding: clamp(24px, 3.2vw, 40px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-strong);
      box-shadow: var(--shadow);
    }
    .term-panel h2 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1; letter-spacing: -.035em; }
    .term-panel-count { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .term-occurrence { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .term-occurrence strong { display: block; }
    .term-occurrence-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .term-occurrence p { margin: 14px 0; font-size: 13px; line-height: 1.5; }
    .term-occurrence a { font-size: 12px; }

    .reading-island {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-strong);
      box-shadow: var(--shadow);
    }
    .reading-tabs { display: flex; gap: 8px; padding: 18px; border-bottom: 1px solid var(--line); }
    .reading-tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      padding: 9px 14px;
      cursor: pointer;
    }
    .reading-tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .reading-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(150px, .42fr);
      gap: clamp(18px, 3vw, 40px);
      align-items: center;
      padding: 22px clamp(20px, 3vw, 36px);
      border-bottom: 1px solid var(--line);
    }
    .reading-row:last-child { border-bottom: 0; }
    .reading-title { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 600; }
    .reading-title a { text-decoration-thickness: 1px; }
    .reading-description { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .reading-meta { display: grid; gap: 4px; font-size: 11px; }
    .reading-meta strong { font-weight: 600; }

    .empty-state { padding: 30px 0; color: var(--muted); }
    .site-footer { padding: 28px 0 44px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

    dialog {
      width: min(560px, calc(100% - 32px));
      max-height: min(720px, calc(100svh - 40px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--bg);
      color: var(--ink);
      box-shadow: 0 30px 90px rgba(24, 23, 21, .24);
    }
    dialog::backdrop { background: rgba(24, 23, 21, .36); backdrop-filter: blur(4px); }
    .archive-head { display: flex; justify-content: space-between; align-items: center; padding: 22px; border-bottom: 1px solid var(--line); }
    .archive-head h2 { margin: 0; font-size: 20px; }
    .close-button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; }
    .archive-list { padding: 0 22px 22px; }
    .archive-item {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: baseline;
      padding: 18px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .archive-item[aria-current="true"] { font-weight: 600; }
    .archive-item time { color: var(--muted); font-size: 11px; }

    @media (max-width: 850px) {
      .shell { width: min(100% - 28px, 720px); }
      .signal-grid, .terms-layout { grid-template-columns: 1fr; }
      .term-panel { position: static; }
    }
    @media (max-width: 560px) {
      .site-header { min-height: 64px; }
      .hero { padding: 42px 0 72px; }
      .edition-title { font-size: clamp(58px, 20vw, 84px); }
      .curation-copy { font-size: 18px; }
      .chapter { padding: 78px 0; }
      .signal-card { padding: 24px; border-radius: 22px; }
      .signal-title { font-size: 34px; }
      .term-grid { grid-template-columns: 1fr; }
      .reading-row { grid-template-columns: 1fr; gap: 12px; }
      .archive-item { grid-template-columns: auto 1fr; }
      .archive-item time { grid-column: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./">Trendices</a>
      <button class="quiet-button" id="openArchive" type="button">Edições</button>
    </header>

    <main>
      <section class="loading-screen" id="loadingScreen" aria-live="polite">
        <div class="loading-mark" aria-label="Carregando edição"></div>
      </section>

      <section class="error-screen" id="errorScreen" hidden>
        <div>
          <p id="errorMessage">Não foi possível carregar esta edição.</p>
          <button class="quiet-button" id="retryButton" type="button">Tentar novamente</button>
        </div>
      </section>

      <div class="edition-view" id="editionView" hidden>
        <section class="hero" id="top">
          <div>
            <div class="edition-date" id="editionDate"></div>
            <h1 class="edition-title" id="editionTitle"></h1>
          </div>
          <div class="curation-copy" id="curationCopy"></div>
        </section>

        <section class="chapter" aria-labelledby="signalsMarker">
          <div class="chapter-marker" id="signalsMarker"><span>02</span><span id="signalsCount"></span></div>
          <div class="signal-grid" id="signalGrid"></div>
        </section>

        <section class="chapter" aria-labelledby="termsMarker">
          <div class="chapter-marker" id="termsMarker"><span>03</span><span id="termsCount"></span></div>
          <h2 class="chapter-title">Tendências e comportamentos citados</h2>
          <div class="terms-layout">
            <div class="term-grid" id="termGrid"></div>
            <aside class="term-panel" id="termPanel" aria-live="polite"></aside>
          </div>
        </section>

        <section class="chapter" id="readingChapter" aria-labelledby="readingMarker">
          <div class="chapter-marker" id="readingMarker"><span>04</span><span id="readingCount"></span></div>
          <div class="reading-island">
            <div class="reading-tabs" role="tablist" aria-label="Leituras">
              <button class="reading-tab" id="newslettersTab" type="button" role="tab" aria-selected="true" aria-controls="readingList">Newsletters</button>
              <button class="reading-tab" id="materialsTab" type="button" role="tab" aria-selected="false" aria-controls="readingList">Materiais</button>
            </div>
            <div id="readingList" role="tabpanel" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">Voltinha do Trendices</footer>
  </div>

  <dialog id="archiveDialog" aria-labelledby="archiveTitle">
    <div class="archive-head">
      <h2 id="archiveTitle">Edições</h2>
      <button class="close-button" id="closeArchive" type="button" aria-label="Fechar">×</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </dialog>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbzEtcKNXviXzehRNxK2M31Jg_gSIyAR0_ReKLBn_CyQU1T05W0G2MQIQKXCyI9K0d4/exec";

    const state = {
      payload: null,
      editions: [],
      currentEdition: null,
      readingMode: "newsletters",
      selectedTerm: 0
    };

    const elements = {
      loading: document.querySelector("#loadingScreen"),
      error: document.querySelector("#errorScreen"),
      errorMessage: document.querySelector("#errorMessage"),
      view: document.querySelector("#editionView"),
      date: document.querySelector("#editionDate"),
      title: document.querySelector("#editionTitle"),
      curation: document.querySelector("#curationCopy"),
      signalsCount: document.querySelector("#signalsCount"),
      signalGrid: document.querySelector("#signalGrid"),
      termsCount: document.querySelector("#termsCount"),
      termGrid: document.querySelector("#termGrid"),
      termPanel: document.querySelector("#termPanel"),
      readingCount: document.querySelector("#readingCount"),
      readingList: document.querySelector("#readingList"),
      newslettersTab: document.querySelector("#newslettersTab"),
      materialsTab: document.querySelector("#materialsTab"),
      archiveDialog: document.querySelector("#archiveDialog"),
      archiveList: document.querySelector("#archiveList")
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);
    }

    function safeUrl(value) {
      if (!value) return "";
      try {
        const url = new URL(String(value));
        return ["http:", "https:", "mailto:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function toArray(value) {
      if (Array.isArray(value)) return value;
      if (!value) return [];
      if (typeof value === "string") {
        try { return toArray(JSON.parse(value)); } catch { return []; }
      }
      if (typeof value === "object") return Array.isArray(value.items) ? value.items : [];
      return [];
    }

    function formatDate(value, options = {}) {
      if (!value) return "";
      const date = new Date(`${value}T12:00:00`);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString("pt-BR", options);
    }

    function formatRange(start, end) {
      const startDate = new Date(`${start}T12:00:00`);
      const endDate = new Date(`${end}T12:00:00`);
      if (Number.isNaN(startDate.getTime()) || Number.isNaN(endDate.getTime())) return [start, end].filter(Boolean).join(" — ");
      const sameMonth = startDate.getMonth() === endDate.getMonth();
      const startText = startDate.toLocaleDateString("pt-BR", sameMonth ? { day: "numeric" } : { day: "numeric", month: "long" });
      const endText = endDate.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
      return `${startText} — ${endText}`;
    }

    function label(value) {
      const labels = {
        read: "LER",
        consult_if_needed: "CONSULTAR",
        do_not_prioritize: "NÃO PRIORIZAR",
        to_read: "PARA LER",
        editorial: "Editorial",
        cultural_visual: "Cultural / visual",
        report_research: "Relatório / pesquisa",
        brand_market: "Marca / mercado",
        operational: "Operacional",
        other: "Outro"
      };
      return labels[value] || String(value || "").replaceAll("_", " ");
    }

    async function requestApi(params = {}) {
      const url = new URL(API_BASE);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== "") url.searchParams.set(key, value);
      });
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`A fonte respondeu ${response.status}.`);
      const data = await response.json();
      if (data?.ok === false) throw new Error(data.error || "A fonte não retornou uma edição válida.");
      return data;
    }

    function extractPayload(response) {
      if (response?.edition?.edition && Array.isArray(response.edition.signals)) return response.edition;
      if (response?.payload?.edition) return response.payload;
      if (response?.edition?.edition_number && Array.isArray(response.signals)) return response;
      return null;
    }

    function sourceMap(payload) {
      return new Map((payload.sources || []).map(source => [String(source.name || ""), source]));
    }

    function signalUrl(signal, sources) {
      const source = sources.get(String(signal.source_name || "")) || {};
      const links = toArray(signal.relevant_links);
      return safeUrl(signal.source_url) || safeUrl(source.source_url) || safeUrl(links[0]?.url || links[0]?.href) || safeUrl(source.website_url);
    }

    function reportLink(payload) {
      const report = (payload.newsletter_items || []).find(item => item.is_report && item.download_available && safeUrl(item.url));
      return report ? safeUrl(report.url) : "";
    }

    function renderHero(payload) {
      const edition = payload.edition || {};
      const curation = payload.curation_summary || {};
      const reportUrl = reportLink(payload);
      elements.date.textContent = formatRange(edition.week_start, edition.week_end);
      elements.title.textContent = `Voltinha #${edition.edition_number ?? "—"}`;
      const lines = [
        [curation.email_count ?? edition.source_email_count ?? "—", "e-mails recebidos"],
        [curation.analyzable_count ?? "—", "evidências analisáveis"],
        [curation.report_count ?? "—", "relatórios encontrados"],
        [curation.downloadable_report_count ?? "—", "relatórios disponíveis"]
      ];
      const priorities = curation.reading_priority || {};
      lines.push([priorities.read ?? "—", "para ler"]);
      lines.push([priorities.consult_if_needed ?? "—", "consultar se necessário"]);
      lines.push([priorities.do_not_prioritize ?? "—", "não priorizar"]);
      elements.curation.innerHTML = lines.map((line, index) => {
        const action = index === 3 && reportUrl
          ? `<a class="curation-link" href="${escapeHTML(reportUrl)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`
          : "";
        return `<span class="curation-line"><strong>${escapeHTML(line[0])}</strong> ${escapeHTML(line[1])}${action}</span>`;
      }).join("");
    }

    function renderSignals(payload) {
      const signals = (payload.signals || []).slice(0, 8);
      const sources = sourceMap(payload);
      elements.signalsCount.textContent = `${signals.length} ${signals.length === 1 ? "sinal" : "sinais"}`;
      if (!signals.length) {
        elements.signalGrid.innerHTML = `<p class="empty-state">Nenhum sinal registrado nesta edição.</p>`;
        return;
      }
      elements.signalGrid.innerHTML = signals.map((signal, index) => {
        const themes = toArray(signal.macro_themes).slice(0, 2);
        const url = signalUrl(signal, sources);
        const sourceDate = formatDate(signal.source_date, { day: "numeric", month: "short" }).replace(".", "");
        const themeHTML = themes.length
          ? themes.map(theme => `<span class="theme-pill">${escapeHTML(theme)}</span>`).join("")
          : "";
        const sourceText = `${signal.source_name || "Fonte não identificada"}${sourceDate ? ` · ${sourceDate}` : ""}`;
        const sourceHTML = url
          ? `<a class="signal-source-link" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(sourceText)}</a>`
          : `<span class="signal-source-text">${escapeHTML(sourceText)}</span>`;
        return `
          <article class="signal-card tone-${(index % 6) + 1}">
            <div class="signal-top">
              <span class="signal-number">${String(index + 1).padStart(2, "0")}</span>
              <div class="theme-list">${themeHTML}</div>
            </div>
            ${signal.theme ? `<p class="signal-support">${escapeHTML(signal.theme)}</p>` : ""}
            <h2 class="signal-title">${escapeHTML(signal.title || "Sinal sem título")}</h2>
            ${signal.synthesis ? `<p class="signal-synthesis">${escapeHTML(signal.synthesis)}</p>` : ""}
            <div class="signal-evidence">
              <div class="signal-evidence-label">Evidência</div>
              <p class="signal-evidence-copy">${escapeHTML(signal.evidence_excerpt || "Evidência não informada.")}</p>
              ${sourceHTML}
            </div>
          </article>`;
      }).join("");
    }

    function groupTerms(items) {
      const groups = new Map();
      items.forEach(item => {
        const title = String(item.title || "").trim();
        if (!title) return;
        const key = title.toLocaleLowerCase("pt-BR");
        if (!groups.has(key)) groups.set(key, { title, occurrences: [] });
        const group = groups.get(key);
        const occurrenceKey = [item.source_name, item.url, item.excerpt].join("|");
        if (!group.occurrences.some(occurrence => occurrence.key === occurrenceKey)) {
          group.occurrences.push({ ...item, key: occurrenceKey });
        }
      });
      return Array.from(groups.values()).sort((a, b) => b.occurrences.length - a.occurrences.length || a.title.localeCompare(b.title, "pt-BR"));
    }

    function renderTermPanel(group) {
      if (!group) {
        elements.termPanel.innerHTML = `<p class="empty-state">Nenhum termo registrado nesta edição.</p>`;
        return;
      }
      elements.termPanel.innerHTML = `
        <h2>${escapeHTML(group.title)}</h2>
        <div class="term-panel-count">${group.occurrences.length} ${group.occurrences.length === 1 ? "fonte" : "fontes"}</div>
        ${group.occurrences.map(item => {
          const url = safeUrl(item.url);
          const date = formatDate(item.source_date, { day: "numeric", month: "short" }).replace(".", "");
          return `<div class="term-occurrence">
            <strong>${escapeHTML(item.source_name || "Fonte não identificada")}</strong>
            <span class="term-occurrence-meta">${escapeHTML(item.email_subject || "")}${item.email_subject && date ? " · " : ""}${escapeHTML(date)}</span>
            ${item.excerpt ? `<p>“${escapeHTML(item.excerpt)}”</p>` : ""}
            ${url ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">Abrir fonte ↗</a>` : ""}
          </div>`;
        }).join("")}`;
    }

    function renderTerms(payload) {
      const terms = groupTerms(payload.named_trends || []);
      state.terms = terms;
      state.selectedTerm = Math.min(state.selectedTerm, Math.max(terms.length - 1, 0));
      elements.termsCount.textContent = `${(payload.named_trends || []).length} termos`;
      if (!terms.length) {
        elements.termGrid.innerHTML = "";
        renderTermPanel(null);
        return;
      }
      elements.termGrid.innerHTML = terms.map((group, index) => `
        <button class="term-button" type="button" data-term-index="${index}" aria-pressed="${index === state.selectedTerm}">
          <span>${escapeHTML(group.title)}</span>
          <span class="term-count">${group.occurrences.length}</span>
        </button>`).join("");
      renderTermPanel(terms[state.selectedTerm]);
    }

    function renderReading(payload) {
      const newsletters = payload.newsletter_items || [];
      const materials = payload.library_items || [];
      elements.readingCount.textContent = `${newsletters.length} newsletters · ${materials.length} materiais`;
      elements.newslettersTab.setAttribute("aria-selected", String(state.readingMode === "newsletters"));
      elements.materialsTab.setAttribute("aria-selected", String(state.readingMode === "materials"));
      const items = state.readingMode === "newsletters" ? newsletters : materials;
      if (!items.length) {
        elements.readingList.innerHTML = `<p class="empty-state" style="padding-left: 28px">Nenhum item registrado nesta edição.</p>`;
        return;
      }
      elements.readingList.innerHTML = items.map(item => {
        const url = safeUrl(item.url);
        const recommendation = state.readingMode === "newsletters" ? label(item.recommendation) : label(item.status);
        const type = state.readingMode === "newsletters" ? label(item.source_type) : label(item.item_type);
        const reportLabel = item.is_report ? (item.download_available ? " · download" : " · relatório") : "";
        const description = item.summary || item.description || "";
        const title = escapeHTML(item.title || "Item sem título");
        const titleHTML = url
          ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${title}</a>`
          : title;
        return `<article class="reading-row">
          <div>
            <h2 class="reading-title">${titleHTML}</h2>
            <p class="reading-description">${escapeHTML(item.source_name || "Fonte não identificada")}${description ? ` · ${escapeHTML(description)}` : ""}</p>
          </div>
          <div class="reading-meta"><strong>${escapeHTML(recommendation)}</strong><span>${escapeHTML(type + reportLabel)}</span></div>
        </article>`;
      }).join("");
    }

    function renderArchive() {
      const current = Number(state.currentEdition);
      elements.archiveList.innerHTML = state.editions.length
        ? state.editions.map(item => `
          <button class="archive-item" type="button" data-edition="${escapeHTML(item.edition_number)}" aria-current="${Number(item.edition_number) === current}">
            <span>#${escapeHTML(item.edition_number)}</span>
            <strong>${escapeHTML(item.summary || "Voltinha do Trendices")}</strong>
            <time>${escapeHTML(formatRange(item.week_start, item.week_end))}</time>
          </button>`).join("")
        : `<p class="empty-state">Nenhuma edição disponível.</p>`;
    }

    function renderEdition(payload) {
      state.payload = payload;
      state.currentEdition = payload.edition?.edition_number;
      state.readingMode = "newsletters";
      state.selectedTerm = 0;
      renderHero(payload);
      renderSignals(payload);
      renderTerms(payload);
      renderReading(payload);
      renderArchive();
      elements.loading.hidden = true;
      elements.error.hidden = true;
      elements.view.hidden = false;
      document.title = `Voltinha #${state.currentEdition} · Trendices`;
    }

    function showLoading() {
      elements.view.hidden = true;
      elements.error.hidden = true;
      elements.loading.hidden = false;
    }

    function showError(error) {
      elements.loading.hidden = true;
      elements.view.hidden = true;
      elements.error.hidden = false;
      elements.errorMessage.textContent = error?.message || "Não foi possível carregar esta edição.";
    }

    async function loadEdition(editionNumber, updateAddress = false) {
      showLoading();
      try {
        const response = await requestApi(editionNumber ? { edition: editionNumber } : {});
        const payload = extractPayload(response);
        if (!payload) throw new Error("A edição recebida não possui o formato esperado.");
        if (!state.editions.length && Array.isArray(response.available_editions)) state.editions = response.available_editions;
        renderEdition(payload);
        if (updateAddress) {
          const url = new URL(window.location.href);
          url.searchParams.set("edition", state.currentEdition);
          window.history.replaceState({}, "", url);
        }
        window.scrollTo({ top: 0, behavior: "auto" });
      } catch (error) {
        console.error(error);
        showError(error);
      }
    }

    async function load() {
      showLoading();
      try {
        const requestedEdition = new URLSearchParams(window.location.search).get("edition");
        const [listResponse, editionResponse] = await Promise.all([
          requestApi({ mode: "list" }),
          requestApi(requestedEdition ? { edition: requestedEdition } : {})
        ]);
        state.editions = Array.isArray(listResponse.editions) ? listResponse.editions : [];
        const payload = extractPayload(editionResponse);
        if (!payload) throw new Error("A edição recebida não possui o formato esperado.");
        renderEdition(payload);
      } catch (error) {
        console.error(error);
        showError(error);
      }
    }

    document.querySelector("#openArchive").addEventListener("click", () => {
      renderArchive();
      elements.archiveDialog.showModal();
    });
    document.querySelector("#closeArchive").addEventListener("click", () => elements.archiveDialog.close());
    elements.archiveDialog.addEventListener("click", event => {
      if (event.target === elements.archiveDialog) elements.archiveDialog.close();
    });
    elements.archiveList.addEventListener("click", event => {
      const button = event.target.closest("[data-edition]");
      if (!button) return;
      elements.archiveDialog.close();
      loadEdition(button.dataset.edition, true);
    });
    elements.termGrid.addEventListener("click", event => {
      const button = event.target.closest("[data-term-index]");
      if (!button) return;
      state.selectedTerm = Number(button.dataset.termIndex);
      elements.termGrid.querySelectorAll("[data-term-index]").forEach(termButton => {
        termButton.setAttribute("aria-pressed", String(termButton === button));
      });
      renderTermPanel(state.terms[state.selectedTerm]);
    });
    elements.newslettersTab.addEventListener("click", () => {
      state.readingMode = "newsletters";
      renderReading(state.payload);
    });
    elements.materialsTab.addEventListener("click", () => {
      state.readingMode = "materials";
      renderReading(state.payload);
    });
    document.querySelector("#retryButton").addEventListener("click", load);

    load();
  </script>
</body>
</html>
